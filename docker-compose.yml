services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiki-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      PHOBERT_MODEL_PATH: ${PHOBERT_MODEL_PATH}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tiki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tiki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tiki-redis
    ports:
      - "6379:6379"
    volumes:
      - tiki_redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: tiki-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - tiki_qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  tiki_postgres_data:
  tiki_redis_data:
  tiki_qdrant_data:
